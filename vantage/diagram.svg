<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1320" height="900" fill="#ffffff"/>
  <text x="40" y="34" font-size="22" font-weight="bold" fill="#0f172a">VANTAGE — product structure</text>

  <!-- Sources -->
  <rect x="60" y="48" width="300" height="92" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="210" y="80" text-anchor="middle" fill="#1f2937"><tspan x="210" dy="0" font-size="13" font-weight="bold">Benchmarked training</tspan><tspan x="210" dy="16" font-size="11.5">EP · Leadership · Comms</tspan><tspan x="210" dy="15" font-size="11.5">Negotiation · Sales · Interpersonal</tspan></text>

  <rect x="510" y="48" width="300" height="92" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="660" y="80" text-anchor="middle" fill="#1f2937"><tspan x="660" dy="0" font-size="13" font-weight="bold">Assessment science</tspan><tspan x="660" dy="16" font-size="11.5">Bates ExPI · Spitzberg-Cupach</tspan><tspan x="660" dy="15" font-size="11.5">BARS · Kirkpatrick</tspan></text>

  <rect x="960" y="48" width="300" height="92" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="1110" y="88" text-anchor="middle" fill="#1f2937"><tspan x="1110" dy="0" font-size="13" font-weight="bold">Proprietary database</tspan><tspan x="1110" dy="16" font-size="11.5">Say What You Mean / NVC spine</tspan></text>

  <line x1="210" y1="140" x2="500" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="140" x2="640" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1110" y1="140" x2="790" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Capability model -->
  <rect x="370" y="170" width="540" height="96" rx="12" fill="#1e3a5f" stroke="#15293f"/>
  <text x="640" y="205" text-anchor="middle" fill="#ffffff"><tspan x="640" dy="0" font-size="16" font-weight="bold">CAPABILITY MODEL + BARS RUBRIC</tspan><tspan x="640" dy="20" font-size="12.5">10 modules → sub-areas → behaviours → drills</tspan><tspan x="640" dy="16" font-size="11.5">(verbal + non-verbal)</tspan></text>

  <!-- Configuration -->
  <rect x="980" y="178" width="300" height="92" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="1130" y="210" text-anchor="middle" fill="#1f2937"><tspan x="1130" dy="0" font-size="13" font-weight="bold">Configuration</tspan><tspan x="1130" dy="16" font-size="11.5">default · manual · AI-guided</tspan><tspan x="1130" dy="15" font-size="11.5">role-based weighting</tspan></text>

  <!-- model -> learn / engine -->
  <line x1="470" y1="266" x2="270" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="266" x2="665" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- config -> engine -->
  <line x1="980" y1="240" x2="904" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Learn -->
  <rect x="60" y="330" width="310" height="120" rx="12" fill="#e3f3e8" stroke="#2e9e5b"/>
  <text x="215" y="370" text-anchor="middle" fill="#14532d"><tspan x="215" dy="0" font-size="15" font-weight="bold">LEARN — curriculum</tspan><tspan x="215" dy="22" font-size="12.5">theory · principles</tspan><tspan x="215" dy="17" font-size="12.5">behaviours · examples · drills</tspan></text>

  <!-- Engine -->
  <rect x="470" y="318" width="430" height="156" rx="12" fill="#fdf0d9" stroke="#e0a52a"/>
  <text x="685" y="356" text-anchor="middle" fill="#7c2d12"><tspan x="685" dy="0" font-size="16" font-weight="bold">EVALUATE — the engine  ★</tspan><tspan x="685" dy="20" font-size="12.5">holistic, self-only scoring</tspan><tspan x="685" dy="17" font-size="12.5">overall · module · sub-area</tspan><tspan x="685" dy="17" font-size="12.5">behavioural · priorities</tspan><tspan x="685" dy="19" font-size="11.5" font-style="italic">reads the room, scores only you</tspan></text>

  <!-- Evidence -->
  <rect x="60" y="510" width="310" height="110" rx="12" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="215" y="548" text-anchor="middle" fill="#1f2937"><tspan x="215" dy="0" font-size="14" font-weight="bold">Evidence capture</tspan><tspan x="215" dy="19" font-size="11.5">meetings · uploads · role-plays</tspan><tspan x="215" dy="15" font-size="11.5">+ optional passive agent</tspan></text>

  <!-- evidence -> engine -->
  <line x1="370" y1="555" x2="468" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- learn -> evidence -->
  <line x1="215" y1="450" x2="215" y2="508" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="485" font-size="11" fill="#334155">practise</text>
  <!-- engine -> learn (dashed routes) -->
  <line x1="468" y1="402" x2="372" y2="402" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <text x="420" y="394" text-anchor="middle" font-size="10.5" fill="#6d28d9">routes to modules</text>

  <!-- Coach -->
  <rect x="440" y="560" width="280" height="118" rx="12" fill="#e7eefb" stroke="#3b6fd4"/>
  <text x="580" y="598" text-anchor="middle" fill="#1e3a8a"><tspan x="580" dy="0" font-size="14" font-weight="bold">Integrated AI coach</tspan><tspan x="580" dy="19" font-size="11.5">prep · interpret · practise</tspan><tspan x="580" dy="15" font-size="11.5">pattern-coach · navigate</tspan></text>

  <!-- Outputs -->
  <rect x="760" y="560" width="340" height="118" rx="12" fill="#e7eefb" stroke="#3b6fd4"/>
  <text x="930" y="598" text-anchor="middle" fill="#1e3a8a"><tspan x="930" dy="0" font-size="14" font-weight="bold">Outputs</tspan><tspan x="930" dy="19" font-size="11.5">post-meeting · daily · weekly</tspan><tspan x="930" dy="15" font-size="11.5">dashboard + top 1–3 priorities</tspan></text>

  <!-- engine -> coach / outputs -->
  <line x1="620" y1="474" x2="585" y2="558" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="474" x2="905" y2="558" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="619" x2="758" y2="619" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop -->
  <rect x="760" y="730" width="340" height="96" rx="12" fill="#ece4f7" stroke="#8b5cf6"/>
  <text x="930" y="768" text-anchor="middle" fill="#4c1d95"><tspan x="930" dy="0" font-size="14" font-weight="bold">Progress loop</tspan><tspan x="930" dy="19" font-size="11.5">trends · reassessment</tspan><tspan x="930" dy="15" font-size="11.5">the transfer problem, solved</tspan></text>

  <!-- outputs -> loop -->
  <line x1="930" y1="678" x2="930" y2="728" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- loop -> evidence (dashed repeat) -->
  <path d="M760,800 C 470,880 300,720 220,622" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <text x="500" y="868" text-anchor="middle" font-size="11" fill="#6d28d9">repeat over real life</text>
</svg>
