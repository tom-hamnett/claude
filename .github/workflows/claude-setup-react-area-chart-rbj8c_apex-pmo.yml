name: Build and deploy APEX-PMO to Azure (Docker)

on:
  push:
    branches:
      - claude/setup-react-area-chart-RBJ8C
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/apex-pmo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_201F160D9C4E4CA6AF3D1A25F8B3D07A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2744C13B5BD04322A5F07611A24231EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2619506372AA4D5A98BB5E1A0DE2C34C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'APEX-PMO'
          images: ghcr.io/${{ env.IMAGE_NAME }}:latest
