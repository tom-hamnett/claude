name: FLUX CI

on:
  push:
    branches:
      - claude/optiq-competitor-process-mapping-U8Zte
  pull_request:

jobs:
  build:
    name: Build & typecheck (flux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
