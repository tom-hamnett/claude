# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - APEX-PMO

on:
  push:
    branches:
      - claude/setup-react-area-chart-RBJ8C
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Build the frontend only. Do NOT ship node_modules — Azure (Oryx)
      # installs dependencies on the server, which correctly compiles the
      # native better-sqlite3 module for the Azure runtime. Shipping a
      # pre-built node_modules caused tar.gz corruption on deploy.
      - name: Install and build frontend
        run: |
          npm install
          npm run build

      - name: Zip source for deployment (exclude node_modules and .git)
        run: zip -r release.zip . -x "node_modules/*" ".git/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact
        run: unzip -o release.zip && rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_201F160D9C4E4CA6AF3D1A25F8B3D07A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2744C13B5BD04322A5F07611A24231EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2619506372AA4D5A98BB5E1A0DE2C34C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'APEX-PMO'
          slot-name: 'Production'
          package: .
