[build]
  base    = "assessment-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (HashRouter doesn't strictly need this, but it's harmless and
# means deep links to /sessions, /reports etc still work if you ever switch).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
